<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life and Ministry Meeting Schedule S-140 Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-container { padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; width: 100% !important; max-width: none !important; }
            @page { size: portrait; margin: 10mm; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-800 flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="no-print bg-slate-800 border-b border-slate-700 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-calendar-days text-sm"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold text-white tracking-wide">S-140 STUDIO</h1>
                <p class="text-[11px] text-slate-400">Atong Kristohanong Pagkinabuhi ug Ministeryo</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="addScheduleBlock()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i><span>Add Schedule</span>
            </button>
            <div class="h-5 w-px bg-slate-700 mx-1"></div>
            <button onclick="triggerPreview()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium text-xs rounded-lg transition flex items-center space-x-1.5 border border-slate-600">
                <i class="fa-solid fa-eye"></i><span>Preview</span>
            </button>
            <button onclick="saveSchedule()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs rounded-lg shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-floppy-disk"></i><span>Save</span>
            </button>
            <button onclick="triggerPrint()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-lg shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-print"></i><span>Print / PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar: Editor Panel -->
        <div class="no-print w-full lg:w-[480px] bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 z-10 shadow-xl">
            <div class="p-4 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i><span>S-140 Schedule Editor</span>
                </h2>
                <button onclick="resetData()" class="px-2 py-1 text-[11px] font-semibold text-rose-600 hover:bg-rose-50 rounded transition border border-rose-200">Reset</button>
            </div>

            <!-- Scrollable Editor Form -->
            <div id="editor-container" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                <!-- Dynamically populated schedule editor blocks -->
            </div>
        </div>

        <!-- Right Preview Area -->
        <div class="flex-1 bg-slate-900 overflow-auto flex flex-col items-center justify-start p-4 sm:p-8 custom-scrollbar relative">
            <div id="preview-canvas-wrapper" class="w-full max-w-[850px] bg-white shadow-2xl rounded-sm p-6 sm:p-10 transition-all duration-300 space-y-8">
                <!-- Preview Content Injected Here -->
            </div>
        </div>

    </div>

    <script>
        let schedules = [
            {
                congregation: "CEBU CENTRAL",
                date: "Nobyembre 16-22",
                chairman: "Juan Dela Cruz",
                song1: "42",
                song2: "85",
                song3: "110",
                noMeeting: false,
                parts: [
                    { id: 1, title: "Introduksiyon", duration: "1 min.", speaker: "", reader: "" },
                    { id: 2, title: "[Ulohan]", duration: "10 min.", speaker: "", reader: "" },
                    { id: 3, title: "Espirituwal nga Bahandi", duration: "10 min.", speaker: "", reader: "" },
                    { id: 4, title: "Pagbasa sa Bibliya", duration: "4 min.", speaker: "", reader: "" },
                    { id: 5, title: "[Ulohan]", duration: "3 min.", speaker: "", reader: "" },
                    { id: 6, title: "[Ulohan]", duration: "4 min.", speaker: "", reader: "" },
                    { id: 7, title: "[Ulohan]", duration: "5 min.", speaker: "", reader: "" },
                    { id: 8, title: "[Ulohan]", duration: "15 min.", speaker: "", reader: "" },
                    { id: 9, title: "[Ulohan]", duration: "15 min.", speaker: "", reader: "" },
                    { id: 10, title: "Pagtun-an sa Kongregasyon sa Bibliya", duration: "30 min.", speaker: "", reader: "" }
                ]
            }
        ];

        window.onload = function() {
            renderEditor();
            renderPreviews();
        };

        function addScheduleBlock() {
            schedules.push({
                congregation: "CEBU CENTRAL",
                date: "Nobyembre 23-29",
                chairman: "Mark Villanueva",
                song1: "43",
                song2: "86",
                song3: "111",
                noMeeting: false,
                parts: [
                    { id: 1, title: "Introduksiyon", duration: "1 min.", speaker: "", reader: "" },
                    { id: 2, title: "[Ulohan]", duration: "10 min.", speaker: "", reader: "" },
                    { id: 3, title: "Espirituwal nga Bahandi", duration: "10 min.", speaker: "", reader: "" },
                    { id: 4, title: "Pagbasa sa Bibliya", duration: "4 min.", speaker: "", reader: "" },
                    { id: 5, title: "[Ulohan]", duration: "3 min.", speaker: "", reader: "" },
                    { id: 6, title: "[Ulohan]", duration: "4 min.", speaker: "", reader: "" },
                    { id: 7, title: "[Ulohan]", duration: "5 min.", speaker: "", reader: "" },
                    { id: 8, title: "[Ulohan]", duration: "15 min.", speaker: "", reader: "" },
                    { id: 9, title: "[Ulohan]", duration: "15 min.", speaker: "", reader: "" },
                    { id: 10, title: "Pagtun-an sa Kongregasyon sa Bibliya", duration: "30 min.", speaker: "", reader: "" }
                ]
            });
            renderEditor();
            renderPreviews();
        }

        function removeScheduleBlock(index) {
            if (schedules.length <= 1) {
                alertBox("Kinahanglan adunay labing minus usa ka eskedyol.");
                return;
            }
            schedules.splice(index, 1);
            renderEditor();
            renderPreviews();
        }

        function toggleNoMeeting(index) {
            schedules[index].noMeeting = !schedules[index].noMeeting;
            renderEditor();
            renderPreviews();
        }

        function updateScheduleField(index, field, value) {
            schedules[index][field] = value;
            renderPreviews();
        }

        function updatePartField(schedIndex, partIndex, field, value) {
            schedules[schedIndex].parts[partIndex][field] = value;
            renderPreviews();
        }

        function renderEditor() {
            const container = document.getElementById('editor-container');
            let html = '';

            schedules.forEach((sched, sIdx) => {
                html += `
                    <div class="space-y-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-600 flex items-center space-x-1.5">
                                <i class="fa-solid fa-calendar-week"></i><span>Eskedyol #${sIdx + 1}</span>
                            </h3>
                            <div class="flex items-center space-x-2">
                                <button onclick="toggleNoMeeting(${sIdx})" class="px-2.5 py-1 text-[11px] font-bold rounded ${sched.noMeeting ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-slate-100 text-slate-700 border-slate-300'} border transition">
                                    <i class="fa-solid fa-calendar-xmark mr-1"></i>Asembliya o Kombensiyon
                                </button>
                                ${schedules.length > 1 ? `<button onclick="removeScheduleBlock(${sIdx})" class="text-rose-600 hover:text-rose-800 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                        </div>

                        ${sched.noMeeting ? `
                            <div class="p-2.5 bg-amber-50 border border-amber-300 rounded-lg text-xs font-bold text-amber-900 flex items-center justify-between">
                                <span><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Walay Eskedyul nga Tigum</span>
                            </div>
                        ` : ''}

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                               <label class="block text-[11px] font-semibold text-slate-600 mb-1">Ngalan sa Kongregasyon</label>
                               <input type="text" value="${sched.congregation}" ${sched.noMeeting ? 'disabled' : ''} oninput="updateScheduleField(${sIdx}, 'congregation', this.value)" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none ${sched.noMeeting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''}">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Petsa</label>
                                <input type="text" value="${sched.date}" ${sched.noMeeting ? 'disabled' : ''} oninput="updateScheduleField(${sIdx}, 'date', this.value)" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none ${sched.noMeeting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''}">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Tsirman</label>
                                <input type="text" value="${sched.chairman}" ${sched.noMeeting ? 'disabled' : ''} oninput="updateScheduleField(${sIdx}, 'chairman', this.value)" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none ${sched.noMeeting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''}">
                            </div>
                            <div class="grid grid-cols-3 gap-1">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Awit 1</label>
                                    <input type="text" value="${sched.song1}" ${sched.noMeeting ? 'disabled' : ''} oninput="updateScheduleField(${sIdx}, 'song1', this.value)" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg text-center font-bold outline-none ${sched.noMeeting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''}">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Awit 2</label>
                                    <input type="text" value="${sched.song2}" ${sched.noMeeting ? 'disabled' : ''} oninput="updateScheduleField(${sIdx}, 'song2', this.value)" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg text-center font-bold outline-none ${sched.noMeeting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''}">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Awit 3</label>
                                    <input type="text" value="${sched.song3}" ${sched.noMeeting ? 'disabled' : ''} oninput="updateScheduleField(${sIdx}, 'song3', this.value)" class="w-full px-2 py-1.5 text-xs border border-slate-300 rounded-lg text-center font-bold outline-none ${sched.noMeeting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''}">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-slate-100 ${sched.noMeeting ? 'opacity-50 pointer-events-none' : ''}">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Mga Bahin sa Tigom</span>
                            ${sched.parts.map((p, pIdx) => `
                                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg space-y-1.5">
                                    <div class="flex items-center justify-between">
                                        <span class="text-[11px] font-bold text-slate-700">Bahin ${pIdx + 1}</span>
                                        <input type="text" value="${p.duration}" ${sched.noMeeting ? 'disabled' : ''} oninput="updatePartField(${sIdx}, ${pIdx}, 'duration', this.value)" class="w-16 px-1.5 py-0.5 text-[11px] border border-slate-300 rounded text-center">
                                    </div>
                                    <input type="text" value="${p.title}" ${sched.noMeeting ? 'disabled' : ''} oninput="updatePartField(${sIdx}, ${pIdx}, 'title', this.value)" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded bg-white font-medium">
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="text" value="${p.speaker}" placeholder="Mamumulong / Estudyante" ${sched.noMeeting ? 'disabled' : ''} oninput="updatePartField(${sIdx}, ${pIdx}, 'speaker', this.value)" class="w-full px-2 py-1 text-[11px] border border-slate-300 rounded bg-white">
                                        <input type="text" value="${p.reader}" placeholder="Asistant / Tigduma" ${sched.noMeeting ? 'disabled' : ''} oninput="updatePartField(${sIdx}, ${pIdx}, 'reader', this.value)" class="w-full px-2 py-1 text-[11px] border border-slate-300 rounded bg-white">
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function resetData() {
            schedules = [{
                congregation: "CEBU CENTRAL",
                date: "Nobyembre 16-22",
                chairman: "Juan Dela Cruz",
                song1: "42",
                song2: "85",
                song3: "110",
                noMeeting: false,
                parts: [
                    { id: 1, title: "Introduksiyon", duration: "1 min.", speaker: "", reader: "" },
                    { id: 2, title: "[Ulohan]", duration: "10 min.", speaker: "", reader: "" },
                    { id: 3, title: "Espirituwal nga Bahandi", duration: "10 min.", speaker: "", reader: "" },
                    { id: 4, title: "Pagbasa sa Bibliya", duration: "4 min.", speaker: "", reader: "" },
                    { id: 5, title: "[Ulohan]", duration: "3 min.", speaker: "", reader: "" },
                    { id: 6, title: "[Ulohan]", duration: "4 min.", speaker: "", reader: "" },
                    { id: 7, title: "[Ulohan]", duration: "5 min.", speaker: "", reader: "" },
                    { id: 8, title: "[Ulohan]", duration: "15 min.", speaker: "", reader: "" },
                    { id: 9, title: "[Ulohan]", duration: "15 min.", speaker: "", reader: "" },
                    { id: 10, title: "Pagtun-an sa Kongregasyon sa Bibliya", duration: "30 min.", speaker: "", reader: "" }
                ]
            }];
            renderEditor();
            renderPreviews();
        }

        function triggerPrint() {
            window.print();
        }

        function triggerPreview() {
            const wrapper = document.getElementById('preview-canvas-wrapper');
            if (wrapper) {
                wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                alertBox("Na-scroll sa Live Preview!");
            }
        }

        function saveSchedule() {
            try {
                localStorage.setItem('s140_schedules', JSON.stringify(schedules));
                alertBox("Na-save na ang schedule sa browser local storage!");
            } catch (e) {
                console.error(e);
                alertBox("Napakyas sa pag-save.");
            }
        }

        function alertBox(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-xs font-medium z-50 flex items-center space-x-2 animate-bounce";
            div.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function renderPreviews() {
            const wrapper = document.getElementById('preview-canvas-wrapper');
            if (!wrapper) return;

            let html = '';
            schedules.forEach((sched) => {
                if (sched.noMeeting) {
                    html += `
                        <div class="bg-white p-6 sm:p-8 rounded-sm border border-slate-300 shadow-sm text-slate-900 mb-8 page-break">
                            <div class="flex justify-between items-start border-b-2 border-slate-900 pb-3 mb-6">
                                <div>
                                    <div class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">[${sched.congregation || 'NGALAN SA KONGREGASYON'}]</div>
                                    <h2 class="text-xl font-black text-slate-900 tracking-tight">Eskedyol sa Midweek nga Tigom</h2>
                                </div>
                            </div>
                            <div class="flex justify-between items-center mb-6 text-xs font-bold border-b border-slate-200 pb-3">
                                <div>[${sched.date || 'PETSA'}] | SENEMANANG PAGBASASA BIBLIYA</div>
                                <div>Tsirman: [${sched.chairman || 'Ngalan'}]</div>
                            </div>
                            <div class="py-16 text-center bg-amber-50/50 border border-amber-200 rounded-lg">
                                <div class="text-base font-extrabold text-amber-900 mb-1">Walay Eskedyul nga Tigum</div>
                                <div class="text-xs text-amber-800">Tungod sa Asembliya o Kombensiyon</div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="bg-white p-6 sm:p-8 rounded-sm border border-slate-300 shadow-sm text-slate-900 mb-8 page-break">
                            <!-- Top Header matching exact S-140 template -->
                            <div class="flex justify-between items-start border-b-2 border-slate-900 pb-3 mb-4">
                                <div>
                                    <div class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">[${sched.congregation || 'NGALAN SA KONGREGASYON'}]</div>
                                    <h2 class="text-xl font-black text-slate-900 tracking-tight">Eskedyol sa Midweek nga Tigom</h2>
                                </div>
                                <div class="text-right text-[11px] font-bold text-slate-700 uppercase tracking-wider">
                                    ATONG KRISTOHANONG PAGKINABUHI UG MINISTERYO
                                </div>
                            </div>

                            <div class="flex justify-between items-center mb-4 text-xs font-bold border-b border-slate-200 pb-3">
                                <div>[${sched.date || 'PETSA'}] | SENEMANANG PAGBASASA BIBLIYA</div>
                                <div>Tsirman:[${sched.chairman || 'Ngalan'}]</div>
                            </div>

                            <div class="space-y-3 text-xs">
                                <!-- Opening Song & Prayer -->
                                <div class="flex justify-between items-center px-1">
                                    <div class="font-bold">• Awit [${sched.song1 || 'Numero'}]</div>
                                    <div class="font-medium text-slate-700">Pag-ampo:[${sched.chairman || 'Ngalan'}]</div>
                                </div>
                                <div class="px-1 font-bold">• Introduksiyon (${sched.parts[0]?.duration || '1 min.'})</div>

                                <!-- BAHANDI GIKAN SA PULONG SA DIYOS (Grey banner) -->
                                <div class="bg-slate-700 text-white font-bold px-3 py-1.5 uppercase text-[11px] tracking-wide mt-3">
                                    BAHANDI GIKAN SA PULONG SA DIYOS
                                </div>

                                <div class="space-y-2 py-1 px-1">
                                    <div class="flex justify-between items-start">
                                        <div>1. <span class="font-bold">${sched.parts[1]?.title || '[Ulohan]'}</span> (${sched.parts[1]?.duration || '10 min.'})</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[1]?.speaker || 'Ngalan'}]</div>
                                    </div>
                                    <div class="flex justify-between items-start">
                                        <div>2. <span class="font-bold">${sched.parts[2]?.title || 'Espirituwal nga Bahandi'}</span> (${sched.parts[2]?.duration || '10 min.'})</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[2]?.speaker || 'Ngalan'}]</div>
                                    </div>
                                    <div class="flex justify-between items-start">
                                        <div>3. <span class="font-bold">${sched.parts[3]?.title || 'Pagbasa sa Bibliya'}</span> (${sched.parts[3]?.duration || '4 min.'}) <span class="text-slate-500 font-normal">Estudyante</span></div>
                                        <div class="font-medium text-slate-700">[${sched.parts[3]?.speaker || 'Ngalan'}]</div>
                                    </div>
                                </div>

                                <!-- MAGMAEPEKTIBO SA MINISTERYO (Gold banner) -->
                                <div class="bg-amber-600 text-white font-bold px-3 py-1.5 uppercase text-[11px] tracking-wide mt-3">
                                    MAGMAEPEKTIBO SA MINISTERYO
                                </div>

                                <div class="space-y-2 py-1 px-1">
                                    <div class="flex justify-between items-start">
                                        <div>5. <span class="font-bold">${sched.parts[4]?.title || '[Ulohan]'}</span> (${sched.parts[4]?.duration || '3 min.'})</div>
                                        <div class="text-slate-500">Estudyante/Asistant:</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[4]?.speaker || 'Ngalan'}/${sched.parts[4]?.reader || 'Ngalan'}]</div>
                                    </div>
                                    <div class="flex justify-between items-start">
                                        <div>6. <span class="font-bold">${sched.parts[5]?.title || '[Ulohan]'}</span> (${sched.parts[5]?.duration || '4 min.'})</div>
                                        <div class="text-slate-500">Estudyante/Asistant:</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[5]?.speaker || 'Ngalan'}/${sched.parts[5]?.reader || 'Ngalan'}]</div>
                                    </div>
                                    <div class="flex justify-between items-start">
                                        <div>7. <span class="font-bold">${sched.parts[6]?.title || '[Ulohan]'}</span> (${sched.parts[6]?.duration || '5 min.'})</div>
                                        <div class="text-slate-500">Estudyante/Asistant:</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[6]?.speaker || 'Ngalan'}/${sched.parts[6]?.reader || 'Ngalan'}]</div>
                                    </div>
                                </div>

                                <!-- KRISTOHANONG PAGKINABUHI (Maroon banner) -->
                                <div class="bg-rose-900 text-white font-bold px-3 py-1.5 uppercase text-[11px] tracking-wide mt-3">
                                    KRISTOHANONG PAGKINABUHI
                                </div>

                                <div class="space-y-2 py-1 px-1">
                                    <div class="font-bold">• Awit [${sched.song2 || 'Numero'}]</div>
                                    <div class="flex justify-between items-start">
                                        <div>8. <span class="font-bold">${sched.parts[7]?.title || '[Ulohan]'}</span> (${sched.parts[7]?.duration || '15 min.'})</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[7]?.speaker || 'Ngalan'}]</div>
                                    </div>
                                    <div class="flex justify-between items-start">
                                        <div>9. <span class="font-bold">${sched.parts[8]?.title || '[Ulohan]'}</span> (${sched.parts[8]?.duration || '15 min.'})</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[8]?.speaker || 'Ngalan'}]</div>
                                    </div>
                                    <div class="flex justify-between items-start">
                                        <div>10. <span class="font-bold">${sched.parts[9]?.title || 'Pagtun-an sa Kongregasyon'}</span> (${sched.parts[9]?.duration || '30 min.'})</div>
                                        <div class="text-slate-500">Tigdumala/Tigbasa:</div>
                                        <div class="font-medium text-slate-700">[${sched.parts[9]?.speaker || 'Ngalan'}/${sched.parts[9]?.reader || 'Ngalan'}]</div>
                                    </div>
                                    <div class="font-bold pt-1">• Konklusyon (3 min.)</div>
                                    <div class="flex justify-between items-center pt-1 pb-2">
                                        <div class="font-bold">• Awit [${sched.song3 || 'Numero'}]</div>
                                        <div class="font-medium text-slate-700">Pag-ampo:[${sched.chairman || 'Ngalan'}]</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            wrapper.innerHTML = html;
        }
    </script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
